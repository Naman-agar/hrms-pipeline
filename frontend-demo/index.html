<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRMS Demo UI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="login-view">
    <div class="card login-card">
      <div class="brand brand-centered">
        <span class="brand-mark">H</span>
        <span class="brand-name">HRMS</span>
      </div>
      <div class="card-header">
        <h2>Sign in</h2>
      </div>
      <form id="login-form" class="form-panel">
        <label>
          Email
          <input type="email" id="login-email" value="asha.mehta@example.com" required />
        </label>
        <label>
          Password
          <input type="password" id="login-password" value="Admin#2026" required />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </div>
      </form>
      <p class="hint">Seeded account: asha.mehta@example.com / Admin#2026 (HR Admin)</p>
    </div>
  </section>

  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">H</span>
        <span class="brand-name">HRMS</span>
      </div>

      <nav id="tabs">
        <button class="tab-btn active" data-tab="users">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm0 1.5c-3 0-6.5 1.5-6.5 4v1.5h13V15.5c0-2.5-3.5-4-6.5-4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Users
        </button>
        <button class="tab-btn" data-tab="roles">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5 4 5v4.5c0 4 2.6 6.9 6 8 3.4-1.1 6-4 6-8V5l-6-2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Roles
        </button>
        <button class="tab-btn" data-tab="departments">
          <svg viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4" width="13" height="12.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7.5h2M11 7.5h2M7 10.5h2M11 10.5h2M7 13.5h2M11 13.5h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Departments
        </button>
      </nav>

      <div id="session-bar" class="hidden">
        <div class="session-user">
          <span class="avatar" id="whoami-avatar"></span>
          <span id="whoami"></span>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-block">Log out</button>
      </div>
    </aside>

    <main>
      <div id="banner" class="hidden"></div>

      <section id="users-tab" class="tab-panel">
        <div class="card">
          <div class="card-header">
            <h2>Users</h2>
          </div>

          <form id="users-filter-form" class="toolbar">
            <div class="toolbar-group toolbar-search">
              <input type="text" id="users-search" placeholder="Search name or email" maxlength="100" />
            </div>
            <div class="toolbar-group">
              <select id="users-status-filter">
                <option value="">Any status</option>
                <option value="invited">Invited</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="suspended">Suspended</option>
              </select>
              <select id="users-role-filter"><option value="">Any role</option></select>
              <select id="users-department-filter"><option value="">Any department</option></select>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
              <select id="users-sort">
                <option value="name">Sort: Name</option>
                <option value="email">Sort: Email</option>
                <option value="department">Sort: Department</option>
                <option value="role">Sort: Role</option>
                <option value="status">Sort: Status</option>
                <option value="last_login">Sort: Last login</option>
              </select>
              <button type="button" id="users-order-toggle" class="btn btn-secondary" title="Toggle sort direction">↑ Asc</button>
              <select id="users-page-size">
                <option value="10">10 / page</option>
                <option value="25" selected>25 / page</option>
                <option value="50">50 / page</option>
                <option value="100">100 / page</option>
              </select>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group toolbar-actions">
              <button type="submit" class="btn btn-secondary">Apply</button>
              <button type="button" id="users-clear-filters" class="btn btn-ghost">Clear</button>
              <button type="button" id="users-new-btn" class="btn btn-primary">+ New user</button>
            </div>
          </form>

          <form id="user-form" class="form-panel hidden">
            <h3 id="user-form-title">New user</h3>
            <div class="form-grid">
              <input type="text" id="user-first-name" placeholder="First name" required />
              <input type="text" id="user-last-name" placeholder="Last name" required />
              <input type="email" id="user-email" placeholder="Email" required />
              <input type="password" id="user-password" placeholder="Password" />
              <select id="user-role" required></select>
              <select id="user-department" required></select>
              <select id="user-status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="suspended">Suspended</option>
              </select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="user-form-cancel" class="btn btn-ghost">Cancel</button>
            </div>
          </form>

          <div class="table-scroll">
            <table>
              <colgroup>
                <col style="width: 20%" />
                <col style="width: 22%" />
                <col style="width: 15%" />
                <col style="width: 13%" />
                <col style="width: 10%" />
                <col style="width: 15%" />
                <col style="width: 5%" />
              </colgroup>
              <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>

          <div id="users-pagination">
            <button type="button" id="users-prev" class="btn btn-secondary">&larr; Prev</button>
            <span id="users-page-info"></span>
            <button type="button" id="users-next" class="btn btn-secondary">Next &rarr;</button>
          </div>
        </div>
      </section>

      <section id="roles-tab" class="tab-panel hidden">
        <div class="card">
          <div class="card-header">
            <h2>Roles</h2>
          </div>
          <form id="role-form" class="toolbar">
            <div class="toolbar-group toolbar-search">
              <input type="text" id="role-name" placeholder="New role name" required />
            </div>
            <div class="toolbar-group toolbar-search">
              <input type="text" id="role-permissions" placeholder="permissions, comma, separated" />
            </div>
            <button type="submit" class="btn btn-primary">Add role</button>
          </form>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Name</th><th>System</th><th>Permissions</th><th></th></tr></thead>
              <tbody id="roles-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="departments-tab" class="tab-panel hidden">
        <div class="card">
          <div class="card-header">
            <h2>Departments</h2>
          </div>
          <form id="department-form" class="toolbar">
            <div class="toolbar-group toolbar-search">
              <input type="text" id="department-name" placeholder="New department name" required />
            </div>
            <button type="submit" class="btn btn-primary">Add department</button>
          </form>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Name</th><th>Active</th><th></th></tr></thead>
              <tbody id="departments-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
